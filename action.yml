name: bs-score
description: >-
  Verify and score bs-score findings deterministically. Every quoted claim is
  checked against the artifact it names; only verified findings score.
author: alexhawat
branding:
  icon: check-circle
  color: red

inputs:
  findings:
    description: Path to the findings JSON to score.
    required: true
  repo-root:
    description: Tree that file locators resolve against.
    required: false
    default: .
  sources:
    description: >-
      Extra evidence sources (prompt dir, review manifest). Space-separated.
    required: false
    default: ""
  fail-over:
    description: Exit 1 when the score exceeds this number (CI gate).
    required: false
    default: ""
  require-depth:
    description: >-
      Fail when a review type that needs a code pass cannot prove one: no
      audit.files_read block, no implementation file in it, or a listed file
      that does not exist. Set to "true" to enable.
    required: false
    default: ""
  no-scan:
    description: >-
      Set to "true" to skip the blast-radius sweep. The occurrence count is then
      reported as not_scanned.
    required: false
    default: ""
  baseline:
    description: Baseline file of accepted findings; only new findings score.
    required: false
    default: ""
  format:
    description: Report format written to the output and printed to the log.
    required: false
    default: json
  ref:
    description: >-
      Git ref of alexhawat/bs_score the scorer is installed from (tag, branch,
      or sha). Defaults to the ref this action was resolved at, so pinning
      `uses: alexhawat/bs_score@<sha>` pins the scorer to the same commit.
      Falls back to main only when that is unavailable (a local `uses: ./`).
    required: false
    default: ""

outputs:
  score:
    description: The Bullshit Score (higher = more bullshit).
    value: ${{ steps.score.outputs.score }}
  band:
    description: Score band — clean, minor drift, misleading, bullshit.
    value: ${{ steps.score.outputs.band }}
  report:
    description: Path to the full report file (report.json or report.md).
    value: ${{ steps.score.outputs.report }}

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v7

    - id: score
      shell: bash
      env:
        FINDINGS: ${{ inputs.findings }}
        REPO_ROOT: ${{ inputs.repo-root }}
        SOURCES: ${{ inputs.sources }}
        FAIL_OVER: ${{ inputs.fail-over }}
        BASELINE: ${{ inputs.baseline }}
        REQUIRE_DEPTH: ${{ inputs.require-depth }}
        NO_SCAN: ${{ inputs.no-scan }}
        FORMAT: ${{ inputs.format }}
        REF: ${{ inputs.ref }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -uo pipefail
        # Pinning the action has to pin the scorer too: a default of `main`
        # meant `uses: alexhawat/bs_score@v1.2.3` still installed main's code.
        REF="${REF:-${ACTION_REF:-main}}"
        args=("$FINDINGS" --repo-root "$REPO_ROOT" -q)
        for src in $SOURCES; do args+=(--sources "$src"); done
        [ -n "$FAIL_OVER" ] && args+=(--fail-over "$FAIL_OVER")
        [ -n "$BASELINE" ] && args+=(--baseline "$BASELINE")
        [ "$REQUIRE_DEPTH" = true ] && args+=(--require-depth)
        [ "$NO_SCAN" = true ] && args+=(--no-scan)
        # report.json is always written so score/band outputs work in every
        # format; the requested format gets its own artifact when it differs.
        uvx --from "git+https://github.com/alexhawat/bs_score@${REF}" bs-score \
          "${args[@]}" --format json -o report.json
        code=$?
        [ "$code" -le 1 ] || exit "$code"
        if [ "$FORMAT" != json ]; then
          uvx --from "git+https://github.com/alexhawat/bs_score@${REF}" bs-score \
            "${args[@]}" --format "$FORMAT" -o "report.$FORMAT" >/dev/null
        fi
        echo "score=$(python3 -c 'import json; print(json.load(open("report.json"))["score"])')" >> "$GITHUB_OUTPUT"
        echo "band=$(python3 -c 'import json; print(json.load(open("report.json"))["band"])')" >> "$GITHUB_OUTPUT"
        echo "report=report.$FORMAT" >> "$GITHUB_OUTPUT"
        exit "$code"
