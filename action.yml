name: bs-score
description: >-
  Verify and score bs-score findings deterministically. Every quoted claim is
  checked against the artifact it names; only verified findings score.
author: alexhawat
branding:
  icon: check-circle
  color: red

inputs:
  findings:
    description: Path to the findings JSON to score.
    required: true
  repo-root:
    description: Tree that file locators resolve against.
    required: false
    default: .
  sources:
    description: >-
      Extra evidence sources (prompt dir, review manifest). Space-separated.
    required: false
    default: ""
  fail-over:
    description: Exit 1 when the score exceeds this number (CI gate).
    required: false
    default: ""
  require-depth:
    description: >-
      Fail when a review type that needs a code pass cannot prove one: no
      audit.files_read block, no implementation file in it, or a listed file
      that does not exist. Set to "true" to enable.
    required: false
    default: ""
  no-scan:
    description: >-
      Set to "true" to skip the blast-radius sweep. The occurrence count is then
      reported as not_scanned.
    required: false
    default: ""
  baseline:
    description: Baseline file of accepted findings; only new findings score.
    required: false
    default: ""
  format:
    description: Report format written to the output and printed to the log.
    required: false
    default: json
  ref:
    description: >-
      Git ref of alexhawat/bs-score the scorer is installed from (tag, branch,
      or sha). Defaults to the ref this action was resolved at, so pinning
      `uses: alexhawat/bs-score@<sha>` pins the scorer to the same commit.
      Falls back to main only when that is unavailable (a local `uses: ./`).
    required: false
    default: ""

outputs:
  score:
    description: >-
      The Bullshit Score (higher = more bullshit). Empty when the run is
      not_valid — there is no score to report, and "None" is not a number.
    value: ${{ steps.score.outputs.score }}
  band:
    description: >-
      Score band — clean, minor drift, misleading, bullshit — or NOT_VALID when
      findings were submitted but none verified.
    value: ${{ steps.score.outputs.band }}
  verdict:
    description: >-
      pass, fail (over --fail-over or --require-depth), or not_valid. A not_valid
      run exits 3, so the step fails, but every output and the report file are
      written first — an `if: always()` step can still post the report.
    value: ${{ steps.score.outputs.verdict }}
  report:
    description: Path to the full report file (report.json or report.md).
    value: ${{ steps.score.outputs.report }}

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v7

    - id: score
      shell: bash
      env:
        FINDINGS: ${{ inputs.findings }}
        REPO_ROOT: ${{ inputs.repo-root }}
        SOURCES: ${{ inputs.sources }}
        FAIL_OVER: ${{ inputs.fail-over }}
        BASELINE: ${{ inputs.baseline }}
        REQUIRE_DEPTH: ${{ inputs.require-depth }}
        NO_SCAN: ${{ inputs.no-scan }}
        FORMAT: ${{ inputs.format }}
        REF: ${{ inputs.ref }}
        ACTION_REF: ${{ github.action_ref }}
        ACTION_REPO: ${{ github.action_repository }}
      run: |
        set -uo pipefail
        # Pinning the action has to pin the scorer too: a default of `main`
        # meant `uses: alexhawat/bs-score@v1.2.3` still installed main's code.
        REF="${REF:-${ACTION_REF:-main}}"
        # Install the scorer from the repository the action was resolved from,
        # not a hardcoded upstream slug — on a fork, the fork's ref is what
        # `uses:` promised.
        ACTION_REPO="${ACTION_REPO:-alexhawat/bs-score}"
        args=("$FINDINGS" --repo-root "$REPO_ROOT" -q)
        for src in $SOURCES; do args+=(--sources "$src"); done
        [ -n "$FAIL_OVER" ] && args+=(--fail-over "$FAIL_OVER")
        [ -n "$BASELINE" ] && args+=(--baseline "$BASELINE")
        [ "$REQUIRE_DEPTH" = true ] && args+=(--require-depth)
        [ "$NO_SCAN" = true ] && args+=(--no-scan)
        # report.json is always written so score/band outputs work in every
        # format; the requested format gets its own artifact when it differs.
        uvx --from "git+https://github.com/${ACTION_REPO}@${REF}" bs-score \
          "${args[@]}" --format json -o report.json
        code=$?
        # 0 scored, 1 over --fail-over, 3 NOT_VALID: report.json exists for all
        # three, so the outputs below are real. Only 2 (unusable input) and the
        # unexpected leave nothing to report; bail before touching report.json.
        # Gating on `-le 1` here exited on NOT_VALID with no outputs written and
        # no report.md for an `if: always()` comment step to read.
        case "$code" in 0|1|3) ;; *) exit "$code" ;; esac
        if [ "$FORMAT" != json ]; then
          uvx --from "git+https://github.com/${ACTION_REPO}@${REF}" bs-score \
            "${args[@]}" --format "$FORMAT" -o "report.$FORMAT" >/dev/null
          fmt_code=$?
          case "$fmt_code" in 0|1|3) ;; *) exit "$fmt_code" ;; esac
          if [ ! -f "report.$FORMAT" ]; then
            echo "report.$FORMAT was not created" >&2
            exit 2
          fi
        fi
        # score is null for not_valid; print "" rather than Python's "None".
        echo "score=$(python3 -c 'import json; s = json.load(open("report.json"))["score"]; print("" if s is None else s)')" >> "$GITHUB_OUTPUT"
        echo "band=$(python3 -c 'import json; print(json.load(open("report.json"))["band"])')" >> "$GITHUB_OUTPUT"
        echo "verdict=$(python3 -c 'import json; print(json.load(open("report.json"))["verdict"])')" >> "$GITHUB_OUTPUT"
        echo "report=report.$FORMAT" >> "$GITHUB_OUTPUT"
        exit "$code"
