[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bs-score"
version = "2.1.0"
description = "Bullshit Score: an LLM finds defects with evidence; bs-score verifies the evidence and scores it deterministically."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Alex Hawat" }]
requires-python = ">=3.10"
keywords = ["llm", "eval", "audit", "code-review", "agent", "skill", "prompt"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["loguru>=0.7.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4.21", "ruff>=0.6", "pyyaml>=6.0"]
# Experimental: MCP server (stdio) exposing audit/score tools.
mcp = ["mcp>=1.2"]

[project.scripts]
bs-score = "bs_score.cli:run"
bs-score-mcp = "bs_score.mcp_server:run"

[project.urls]
Homepage = "https://github.com/alexhawat/bs_score"
Source = "https://github.com/alexhawat/bs_score"
Issues = "https://github.com/alexhawat/bs_score/issues"
Changelog = "https://github.com/alexhawat/bs_score/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/bs_score"]

# The repo-root scoring.json / findings.schema.json stay canonical (docs quote those
# paths); the wheel carries a copy so an installed bs-score is self-contained.
[tool.hatch.build.targets.wheel.force-include]
"scoring.json" = "bs_score/data/scoring.json"
"findings.schema.json" = "bs_score/data/findings.schema.json"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "agents", "*.json", "*.md", "*.txt", "*.py", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
# examples/fixture-repo holds deliberately broken code for the examples to quote.
extend-exclude = ["examples/fixture-repo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
