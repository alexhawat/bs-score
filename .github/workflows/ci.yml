name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --extra dev --python ${{ matrix.python-version }}
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q
      - name: Wrappers are generated, not hand-edited
        run: uv run python scripts/gen_agent_wrappers.py --check
      - name: Receipts match a fresh run
        run: uv run python scripts/check_receipts.py

  uvx-install:
    # The docs claim `uvx --from git+<repo>@<ref>` installs the scorer without a
    # clone. This runs that exact command against the commit under test, so the
    # claim is proven rather than grepped for.
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: astral-sh/setup-uv@v5
      - name: Install and run from a git ref, with no checkout
        env:
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          uvx --from "git+https://github.com/${GITHUB_REPOSITORY}@${REF}" bs-score --version
          uvx --from "git+https://github.com/${GITHUB_REPOSITORY}@${REF}" bs-score --help > /dev/null

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - name: A fabricated audit must score zero
        run: |
          score=$(uv run bs-score examples/findings.hallucinated.json \
            --repo-root examples/fixture-repo -q | uv run python -c 'import json,sys; print(json.load(sys.stdin)["score"])')
          test "$score" = "0" || { echo "fabricated audit scored $score"; exit 1; }
      - name: Score this repository against itself
        run: uv run bs-score examples/findings.self.json --repo-root . --format md --fail-over 0
