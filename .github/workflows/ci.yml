name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: uv sync --extra dev --python ${{ matrix.python-version }}
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q
      - name: Wrappers are generated, not hand-edited
        run: uv run python scripts/gen_agent_wrappers.py --check
      - name: llms.txt files are generated, not hand-edited
        run: uv run python scripts/gen_llms_txt.py --check
      - name: Receipts match a fresh run
        run: uv run python scripts/check_receipts.py

  uvx-install:
    # The docs claim `uvx --from git+<repo>@<ref>` installs the scorer without a
    # clone. This runs that exact command against the commit under test, so the
    # claim is proven rather than grepped for.
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: astral-sh/setup-uv@v7
      - name: Install and run from a git ref, with no checkout
        env:
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          uvx --from "git+https://github.com/${GITHUB_REPOSITORY}@${REF}" bs-score --version
          uvx --from "git+https://github.com/${GITHUB_REPOSITORY}@${REF}" bs-score --help > /dev/null

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --extra dev
      - name: Run bs-score against itself
        run: uv run python scripts/check_dogfood.py
