# Wire bs-score into pre-commit.com:
#
#   - repo: https://github.com/alexhawat/bs-score
#     rev: main            # no releases are tagged yet — pin a sha or a tag once there is one
#     hooks:
#       - id: bs-score
#         files: ^findings\.json$
#         args: [--repo-root, ., --fail-over, "10"]
#
# `files:` is not optional. bs-score takes exactly one findings payload, so
# without it pre-commit hands the hook every staged JSON file and the run fails
# with "unrecognized arguments" (or exit 2 on the first non-findings JSON).
- id: bs-score
  name: bs-score
  description: >-
    Verify bs-score findings against the artifacts they quote and score what
    survived. Fails when the score exceeds --fail-over.
  entry: bs-score
  language: python
  types: [json]
  pass_filenames: true
